<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- tables are used to arrange data in rows and columns
     colum - vertical
     row - horizontal
     th - table head 
     td - table data 
     tr - table row
     the border is used to make the content in line
     rowspan and colspan is used to -->
     <table border="10">
        <th>S/N</th>
        <th>Names</th>
        <th>Account balance</th>
        <th>Universities</th>
        <tr>
            <td>1</td>
            <td>David</td>
            <td>$10,000,000</td>
            <td>LASU</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Seun</td>
            <td>$20,000,000</td>
            <td>LASU</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Tolu</td>
            <td>$30,000,000</td>
            <td>LASU</td>
        </tr>
     </table>
</body>
</html>
